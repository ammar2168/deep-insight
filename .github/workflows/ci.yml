name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: journalling_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/journalling_app_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Minted per run rather than committed. It only ever unlocks the
      # throwaway Postgres container above, so the old hardcoded value
      # protected nothing — but a key sitting in a repository invites the
      # question of whether it is a real one, and the answer should be
      # obvious without having to trust a comment.
      - name: Mint a throwaway encryption key for this run
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: pnpm typecheck

      - run: pnpm check

      - run: pnpm db:migrate

      - run: pnpm test

      - run: pnpm build
